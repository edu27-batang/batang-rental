<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4EFE6">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="styles.css">
<meta name="robots" content="noindex, nofollow">
<title>바탕 대여함 관리자</title>
<style>
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:8px}
.stat{background:var(--card);border-radius:18px;box-shadow:var(--sh1);padding:16px 14px;text-align:left;transition:transform .12s}
.stat:active{transform:scale(.97)}
.stat small{display:block;color:var(--sub);font-size:13px;font-weight:600}
.stat b{display:block;font-size:28px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.hot b{color:var(--point)}
.stat.on{box-shadow:0 0 0 2px var(--ink),var(--sh1)}
.tabs{display:flex;gap:6px;margin:22px 0 4px;overflow-x:auto;scrollbar-width:none}
.tabs button{height:38px;padding:0 14px;border-radius:12px;font-size:15px;font-weight:600;color:var(--sub);white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg)}
.rc{background:var(--card);border-radius:18px;box-shadow:var(--sh1);padding:16px 16px 14px;margin-top:10px}
.rc .who{font-size:14px;color:var(--sub);margin-top:4px}
.rc .who a{color:var(--sub);text-decoration:none;border-bottom:1px solid var(--line)}
.rc .acts{display:flex;gap:8px;margin-top:12px}
.rc .acts .btn{flex:1;width:auto;height:44px;font-size:15px;border-radius:12px}
.btn.line{background:var(--card2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.dark{background:var(--ink);color:var(--bg);box-shadow:var(--sh1)}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--warn-soft);color:var(--ink);border-radius:16px;padding:14px 16px;font-size:14px;margin-top:10px}
.note b{color:var(--warn)}
.pin{text-align:center;letter-spacing:.5em;font-size:24px!important;font-weight:700}
.poster{background:#FAF7F1;color:#2B2B2B;border-radius:18px;padding:30px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;
  --ink:#2B2B2B;--mid:#A08C72;--point:#C8553D}
.poster h2{font-size:30px;margin:8px 0 0;letter-spacing:-0.02em}
.poster p{margin:0;color:#6B6357;font-size:15px}
.poster .qr{background:#fff;padding:14px;border-radius:16px;margin:16px 0 10px;box-shadow:0 4px 16px rgba(60,45,30,.1)}
.poster .qr img,.poster .qr canvas{display:block;width:220px!important;height:220px!important}
.poster .steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.poster .steps span{background:#EDE2D0;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.url{word-break:break-all;font-size:13px;color:var(--sub);margin:12px 2px 0}
@media print{
  body *{visibility:hidden}
  .poster,.poster *{visibility:visible}
  .poster{position:fixed;left:0;top:0;width:100%;box-shadow:none;border-radius:0;padding:60px 40px}
  .poster .qr img,.poster .qr canvas{width:320px!important;height:320px!important}
  .poster h2{font-size:44px}.poster p{font-size:20px}.poster .steps span{font-size:18px}
}
</style>
</head>
<body>
<div class="app wide" id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var A = { token: null, data: null, tab: 'pending' };
try { A.token = sessionStorage.getItem('batang_admin'); } catch (e) { }

function render() {
  if (!A.token) return renderLogin();
  if (!A.data) { $('#app').innerHTML = adminTop() + '<div class="list" style="margin-top:20px"><div class="skel"></div><div class="skel"></div></div>'; return refresh(); }
  var d = A.data;
  document.title = (d.pending.length ? '(' + d.pending.length + ') ' : '') + '바탕 대여함 관리자';
  var html = adminTop();
  if (d.defaultPin) html += '<div class="note"><b>!</b><div>관리자 PIN이 처음 값(0000)이에요. 시트의 [설정]에서 바꿔 주세요.</div></div>';
  if (!d.webUrlSet) html += '<div class="note"><b>!</b><div>[설정] 시트의 <b>웹앱 주소</b>가 비어 있어 메일 속 링크가 빠져요. 이 주소를 적어 주세요: ' + esc(pageBase()) + '</div></div>';
  if (!d.adminEmailsSet) html += '<div class="note"><b>!</b><div>관리자 이메일이 비어 있어 반납 알림을 받을 수 없어요. 시트의 [설정]에 적어 주세요.</div></div>';
  html += '<div class="stats">' +
    stat('pending', '확인 대기', d.pending.length, d.pending.length > 0) +
    stat('out', '대여 중', d.out.length, false) +
    stat('overdue', '연체', d.overdue.length, d.overdue.length > 0) + '</div>';
  html += '<div class="tabs">' +
    tab('pending', '확인 대기') + tab('out', '대여 중') + tab('overdue', '연체') + tab('items', '물품') + tab('recent', '기록') + '</div>';
  html += '<div id="pane">' + PANES[A.tab](d) + '</div>';
  $('#app').innerHTML = html;
}
function adminTop() {
  return '<div class="top"><div class="brand">' + logo(30) + '<span>관리자</span></div><div class="row" style="gap:4px">' +
    (A.token ? '<button class="icon-btn" aria-label="QR 인쇄" onclick="openQr()">' + I.qr + '</button>' +
      '<button class="icon-btn" aria-label="새로고침" onclick="refresh(true)">' + I.refresh + '</button>' : '') + '</div></div>';
}
function stat(key, label, n, hot) {
  return '<button class="stat' + (hot ? ' hot' : '') + (A.tab === key ? ' on' : '') + '" onclick="setTab(\'' + key + '\')"><small>' + label + '</small><b>' + n + '</b></button>';
}
function tab(key, label) { return '<button class="' + (A.tab === key ? 'on' : '') + '" onclick="setTab(\'' + key + '\')">' + label + '</button>'; }
function setTab(t) { A.tab = t; render(); }

function who(r) {
  return esc(r.name) + ' · ' + esc(r.studentId) + ' · <a href="tel:' + esc(r.phone) + '">' + esc(r.phone) + '</a>';
}
function head(r, chip) {
  return '<div class="row"><span class="num">' + esc(r.itemId) + '</span><div class="grow nm">' + esc(r.itemName) + '</div>' + (chip || '') + '</div>';
}
function dueChip(r) { return r.overdue ? '<span class="chip bad">' + r.daysLate + '일 연체</span>' : '<span class="chip mute">' + esc(r.due) + '</span>'; }
function empty(t) { return '<div class="card empty" style="margin-top:10px">' + t + '</div>'; }

var PANES = {
  pending: function (d) {
    if (!d.pending.length) return empty('확인할 반납이 없어요');
    return (d.pending.length > 1 ? '<div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn sm dark" onclick="confirmAll(this)">모두 확인 ' + d.pending.length + '</button></div>' : '') +
      d.pending.map(function (r) {
        return '<div class="rc">' + head(r, r.overdue ? '<span class="chip bad">연체 반납</span>' : '') +
          '<div class="who">' + who(r) + '</div><div class="who">반납 신청 ' + esc(r.returnReq) + '</div>' +
          '<div class="acts"><button class="btn line" onclick="act(\'adminReject\',\'' + r.rid + '\',this,\'자리에 없다고 알렸어요\')">자리에 없어요</button>' +
          '<button class="btn primary" onclick="act(\'adminConfirm\',\'' + r.rid + '\',this,\'반납 확인했어요\')">확인</button></div></div>';
      }).join('');
  },
  out: function (d) {
    if (!d.out.length) return empty('대여 중인 물품이 없어요');
    var list = d.out.slice().sort(function (a, b) { return b.daysLate - a.daysLate; });
    return list.map(function (r) {
      return '<div class="rc">' + head(r, dueChip(r)) + '<div class="who">' + who(r) + '</div><div class="who">대여 ' + esc(r.rentedAt) + '</div>' +
        '<div class="acts"><button class="btn line" onclick="lost(\'' + r.rid + '\',this)">분실</button>' +
        '<button class="btn line" onclick="act(\'adminConfirm\',\'' + r.rid + '\',this,\'반납 처리했어요\')">직접 반납 처리</button></div></div>';
    }).join('');
  },
  overdue: function (d) {
    if (!d.overdue.length) return empty('연체가 없어요');
    return d.overdue.map(function (r) {
      return '<div class="rc">' + head(r, dueChip(r)) + '<div class="who">' + who(r) + '</div>' +
        '<div class="acts"><a class="btn line" href="tel:' + esc(r.phone) + '">' + I.phone.replace('<svg', '<svg width="18" height="18"') + ' 전화</a>' +
        '<button class="btn primary" onclick="remind(\'' + r.rid + '\',this)">메일 다시 보내기</button></div></div>';
    }).join('');
  },
  items: function (d) {
    if (!d.items.length) return empty('시트의 [물품]에 물품을 적어 주세요');
    var cls = { '대여가능': 'ok', '대여중': 'mute', '반납확인중': 'warn', '사용중지': 'bad' };
    return '<div class="list">' + d.items.map(function (it) {
      var canToggle = it.status === '대여가능' || it.status === '사용중지';
      return '<div class="item"><span class="num">' + esc(it.id) + '</span><div class="grow"><div class="nm">' + esc(it.name) + '</div><div class="ds">' + esc(it.type) + '</div></div>' +
        (canToggle ? '<button class="chip ' + cls[it.status] + '" style="height:32px;padding:0 12px" onclick="toggleItem(\'' + esc(it.id) + '\',\'' + it.status + '\',this)">' + it.status + '</button>'
                   : '<span class="chip ' + (cls[it.status] || 'mute') + '">' + esc(it.status) + '</span>') + '</div>';
    }).join('') + '</div><p class="foot">물품 추가·이름 변경은 시트의 [물품]에서 해요. 상태를 누르면 대여가능 ↔ 사용중지</p>';
  },
  recent: function (d) {
    if (!d.recent.length) return empty('아직 기록이 없어요');
    return '<div class="list">' + d.recent.map(function (r) {
      return '<div class="item"><span class="num">' + esc(r.itemId) + '</span><div class="grow"><div class="nm">' + esc(r.itemName) + '</div><div class="ds">' + esc(r.name) + ' · ' + esc(r.returnOk) + '</div></div>' +
        '<span class="chip ' + (r.status === '분실' ? 'bad' : 'ok') + '">' + esc(r.status) + '</span></div>';
    }).join('') + '</div><p class="foot">전체 기록은 시트의 [대여기록]에 있어요</p>';
  }
};

/* ── 로그인 ── */
function renderLogin() {
  $('#app').innerHTML = '<div class="fade" style="max-width:400px;margin:0 auto;width:100%">' + adminTop() +
    '<div class="done" style="padding-top:40px">' + logo(64) + '<h1 class="title">관리자 PIN</h1></div>' +
    '<label class="field"><input id="pin" class="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="12" placeholder="••••"></label>' +
    '<button class="btn primary" id="loginBtn" onclick="login(this)">들어가기</button></div>';
  var p = $('#pin'); p.focus();
  p.addEventListener('keydown', function (e) { if (e.key === 'Enter') login($('#loginBtn')); });
}
function login(btn) {
  var pin = $('#pin').value.trim();
  if (!pin) return toast('PIN을 입력해 주세요');
  busy(btn, true);
  call('adminLogin', { pin: pin }).then(function (r) {
    A.token = r.token; try { sessionStorage.setItem('batang_admin', r.token); } catch (e) { }
    A.data = null; render();
  }).catch(function (e) { busy(btn, false); $('#pin').value = ''; toast(e.message); });
}
function onAuthFail(e) {
  if (/로그인/.test(e.message)) { A.token = null; A.data = null; try { sessionStorage.removeItem('batang_admin'); } catch (x) { } render(); }
  toast(e.message);
}

/* ── 데이터 ── */
function refresh(manual) {
  return call('adminData', { token: A.token }).then(function (d) {
    A.data = d; render(); if (manual) toast('새로 불러왔어요');
  }).catch(onAuthFail);
}
function act(name, rid, btn, msg) {
  busy(btn, true);
  call(name, { token: A.token, rentalIds: [rid] }).then(function () { toast(msg); return refresh(); })
    .catch(function (e) { busy(btn, false); onAuthFail(e); });
}
function confirmAll(btn) {
  busy(btn, true);
  var ids = A.data.pending.map(function (r) { return r.rid; });
  call('adminConfirm', { token: A.token, rentalIds: ids }).then(function (r) { toast(r.count + '건 확인했어요'); return refresh(); })
    .catch(function (e) { busy(btn, false); onAuthFail(e); });
}
function lost(rid, btn) {
  ask('분실로 처리할까요?', '물품은 사용중지로 바뀌어요.', '분실 처리').then(function (yes) {
    if (yes) act('adminMarkLost', rid, btn, '분실 처리했어요');
  });
}
function remind(rid, btn) {
  busy(btn, true);
  call('adminRemind', { token: A.token, rentalId: rid }).then(function () { busy(btn, false); btn.textContent = '보냈어요'; btn.disabled = true; toast('메일을 보냈어요'); })
    .catch(function (e) { busy(btn, false); onAuthFail(e); });
}
function toggleItem(id, status, btn) {
  var next = status === '대여가능' ? '사용중지' : '대여가능';
  btn.disabled = true;
  call('adminItemStatus', { token: A.token, itemId: id, status: next }).then(function () { toast(id + ' · ' + next); return refresh(); })
    .catch(function (e) { btn.disabled = false; onAuthFail(e); });
}

/* ── QR 인쇄 ── */
/** 지금 열려 있는 관리자 화면 주소에서 학우용 주소를 만든다. 예) https://x.github.io/batang-rental/admin.html → https://x.github.io/batang-rental/ */
function pageBase() {
  return location.origin + location.pathname.replace(/[^/]*$/, '');
}
function qrUrl() { return (A.data && A.data.appUrl) || (/^https?:/.test(location.protocol) ? pageBase() : ''); }
function openQr() {
  var url = qrUrl();
  $('#modal').innerHTML = '<div class="overlay" onclick="if(event.target===this)closeQr()"><div class="sheet">' +
    '<div class="row" style="justify-content:space-between;margin-bottom:12px"><b style="font-size:18px">과방에 붙일 QR</b><button class="icon-btn" aria-label="닫기" onclick="closeQr()">' + I.close + '</button></div>' +
    '<div class="poster">' + logo(56, '#FAF7F1') + '<h2>바탕 대여함</h2><p>전공서적 · 복지물품</p>' +
    '<div class="qr" id="qrBox"></div>' +
    '<div class="steps"><span>① QR 찍기</span><span>② 물품 고르기</span><span>③ 번호 확인</span></div></div>' +
    (url ? '<p class="url">' + esc(url) + '</p>' : '<p class="url">GitHub Pages에 올린 뒤에 QR이 만들어져요</p>') +
    '<div class="row" style="margin-top:14px"><button class="btn soft" onclick="copyUrl()">주소 복사</button>' +
    (window.LocalApi ? '' : '<button class="btn primary" onclick="window.print()">인쇄</button>') + '</div>' +
    '</div></div>';
  if (url && window.QRCode) new QRCode($('#qrBox'), { text: url, width: 440, height: 440, colorDark: '#2B2B2B', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M });
}
function closeQr() { $('#modal').innerHTML = ''; }
function copyUrl() {
  var url = qrUrl();
  var fallback = function () { toast('주소를 길게 눌러 복사해 주세요'); };
  try { navigator.clipboard.writeText(url).then(function () { toast('주소를 복사했어요'); }, fallback); } catch (e) { fallback(); }
}

render();
setInterval(function () { if (A.token && A.data && !document.hidden && !$('#modal').innerHTML) refresh(); }, 60000);
</script>
</body>
</html>
